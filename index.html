<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우주 탐험</title>
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 40%, #12163a, #02030a); color: #dfe4ff;
    font-family: system-ui, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 0 16px; }
  h1 { margin: 0; font-size: clamp(28px, 6vw, 48px); }
  p { margin: 0; color: #9aa4d6; }
  a.btn { display: inline-block; padding: 14px 32px; border-radius: 999px; background: #3a46c8; color: #fff;
    text-decoration: none; font-size: 18px; font-weight: 600; border: 1px solid #7a86ff; transition: background .2s, transform .2s; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  a.btn.jeju { background: #e07b1a; border-color: #ffb066; }
  a.btn.jeju:hover { background: #f59232; }
  a.btn:hover { background: #5563f0; transform: translateY(-2px); }
</style>
</head>
<body>
<main>
  <h1>🚀 우주 탐험</h1>
  <p>three.js로 만든 태양계와 우주선을 만나보세요.</p>
  <div class="btns">
    <a class="btn" href="space.html">우주 장면 실행하기</a>
    <a class="btn jeju" href="jeju.html">제주도 장면 실행하기</a>
  </div>
</main>
</body>
</html>
